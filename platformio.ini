; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_port = rfc2217://localhost:4000

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=0
